<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Χριστούγεννα στα Ελληνικά!</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#153f74;color-scheme:light}
*{box-sizing:border-box}
html{height:100%;overflow:hidden}
body{margin:0;width:100%;height:100vh;height:100dvh;background:#fff8ee;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;text-align:center;background:#fffaf1;border-bottom:2px solid #17569a;padding:6px 8px 5px;z-index:2}
h1{font:700 clamp(21px,3.2vw,36px)/1.1 Georgia,"Times New Roman",serif;color:#19518f;margin:0}
header p{font-size:clamp(11px,1.35vw,15px);margin:2px 0 0}
.viewport{flex:1 1 0;min-height:0;width:100%;position:relative;overflow:hidden;display:grid;place-items:center;container-type:size;background:linear-gradient(145deg,#edf6ff 0%,#f8e8cb 50%,#d6e9fb 100%)}
.viewport::before{content:"";position:absolute;inset:-25px;background-image:var(--scene-background,none);background-size:cover;background-position:center;filter:blur(30px);opacity:.28;pointer-events:none}
.scene{position:relative;z-index:1;aspect-ratio:3/2;width:min(100cqw,150cqh);max-width:100%;max-height:100%;margin:auto;line-height:0;flex:none;box-shadow:0 5px 35px #12345a35}
.scene>img{display:block;width:100%;height:100%;object-fit:contain;aspect-ratio:3/2}
.door{position:absolute;background:transparent;border:0;border-radius:10%;cursor:pointer;z-index:1;transition:background .2s,box-shadow .2s;touch-action:manipulation;padding:0}
.door:hover,.door:focus-visible{background:#fff1b736;box-shadow:inset 0 0 0 4px #fbc659;outline:2px solid #fff}
.door.locked{cursor:not-allowed}
.door.locked:hover{background:#6e27361c;box-shadow:none;outline:none}
.knob{position:absolute;left:79%;top:64%;width:10%;aspect-ratio:1;border-radius:50%;border:1px solid #fff5d5;box-shadow:0 0 0 2px #f6f2e5bb,0 1px 7px #17365777;pointer-events:none}
.door.available .knob{background:radial-gradient(circle at 28% 24%,#bdf4b4,#299e3d 55%,#12602c)}
.door.locked .knob{background:radial-gradient(circle at 28% 24%,#ffb9a7,#db3335 58%,#822227)}
.note{flex:0 0 auto;font-size:clamp(11px,1.15vw,13px);text-align:center;margin:0;padding:1px 6px 3px;color:#265788;background:#fffaf1}
.legend{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font-size:clamp(11px,1.1vw,13px);color:#265788;margin:0;padding:5px 7px 1px;background:#fffaf1}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px #fff,0 0 0 2px #bdbcb6}
.legend-dot.open{background:#299e3d}.legend-dot.closed{background:#d63a39}
.overlay[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(8,31,58,.73);z-index:5;display:grid;place-items:center;padding:16px}
.modal{width:min(100%,620px);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fffdf6;border:3px solid #26609a;box-shadow:0 20px 70px #00193680;border-radius:20px;padding:25px;position:relative;line-height:1.5}
.modal h2{font:700 30px Georgia,serif;margin:0 45px 12px 0;color:#174c87}
.close{position:absolute;right:13px;top:11px;background:#e9f1fa;border:0;border-radius:50%;width:40px;height:40px;color:#164c87;font-size:25px;cursor:pointer}
.task-title{font-weight:800;font-size:21px;margin:4px 0 6px}
.question-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:8px 0}
.question{flex:1 1 270px;min-width:0;font-size:19px;white-space:pre-wrap;margin:0}
.help-toggle{flex:0 0 auto;background:#fff0cb;border:1px solid #b88827;color:#644713;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:750;cursor:pointer}
.help-toggle:hover{background:#ffe5a8}
.help-text{background:#fff1d7;border-left:4px solid #cf9c2f;border-radius:5px;margin:7px 0 13px;padding:12px;white-space:pre-wrap;font-size:16px;color:#4b3f20}
.help-text[hidden]{display:none}
label{display:block;font-weight:650;margin:13px 0 5px}
input,textarea{display:block;width:100%;border:1px solid #8daaca;border-radius:9px;padding:12px;font:17px system-ui,sans-serif;color:#203c63;background:#fff}
textarea{min-height:110px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0 0}
.action{background:white;border:1px solid #1e5590;color:#1d5086;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:750;cursor:pointer}
.action.primary{background:#1b5796;color:#fff}
.action:focus-visible,.close:focus-visible,.help-toggle:focus-visible{outline:3px solid #e6b654;outline-offset:2px}
.status{font-size:13px;color:#456485;margin:12px 0 0}
.toast{position:fixed;top:clamp(105px,18vh,190px);left:50%;transform:translateX(-50%);z-index:8;background:linear-gradient(180deg,#1f6aa5,#174f83);color:#fff;padding:18px 24px;border-radius:16px;border:3px solid #fff3c9;box-shadow:0 14px 36px #132d5390;font-size:clamp(18px,2.2vw,25px);font-weight:800;line-height:1.35;text-align:center;width:min(92vw,760px);max-width:calc(100% - 24px)}
.toast[hidden]{display:none}
.foot{display:none}
@media(max-width:680px){header{padding:6px 5px 4px}.modal{padding:18px}.modal h2{font-size:25px}.question-row{gap:7px}.legend{gap:11px}}
@media(max-height:480px){header{padding:2px 5px}header h1{font-size:20px}header p{display:none}.legend{padding:2px}.note{display:none}.modal{padding:12px}.modal h2{font-size:21px}}
@media(max-width:680px){.toast{top:clamp(85px,15dvh,155px);bottom:auto;font-size:clamp(17px,4.8vw,22px);padding:16px 18px}}

/* Touch-friendly mobile calendar: 4 columns × 6 rows; the desktop artwork stays unchanged. */
.mobile-banner,.mobile-grid{display:none}

  header{padding:5px 8px 4px}
  header h1{font-size:clamp(19px,5.6vw,29px)}
  header p{font-size:12px}
  .viewport{background:#f0f7ff}
  .viewport::before{display:none}
  .scene{display:flex;flex-direction:column;width:100%;height:100%;max-height:100%;max-width:100%;aspect-ratio:auto;margin:0;box-shadow:none;background:linear-gradient(180deg,#eaf5ff,#fff6e8);overflow:hidden}
  .scene>img,.scene>.door{display:none}

  .mobile-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(4px,0.95dvh,9px);padding:clamp(6px,1dvh,10px) 9px}
  .mobile-door{position:relative;display:grid;place-items:center;min-width:0;min-height:0;border-radius:11px;border:2px solid #1d5a9b;box-shadow:0 2px 5px #143d6330;background:linear-gradient(145deg,#fffef9 0%,#f1e9d7 100%);color:#114577;font:bold clamp(19px,5.8vw,30px)/1 Georgia,serif;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(36,100,165,.24);padding:4px 14px 4px 3px}
  .mobile-door::before{content:'⌜';position:absolute;left:3px;top:0px;color:#2963a1;font-size:18px;font-weight:normal;line-height:1}
  .mobile-door::after{content:'⌟';position:absolute;right:3px;bottom:0px;color:#2963a1;font-size:18px;font-weight:normal;line-height:1}
  .mobile-door.available{background:linear-gradient(145deg,#fffefb,#e5f5e6);border-color:#247545}
  .mobile-door.locked{background:linear-gradient(145deg,#fffdf8,#f8edeb);border-color:#bf5255}
  .mobile-door .mini-knob{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:clamp(11px,3.6vw,15px);height:clamp(11px,3.6vw,15px);border:1px solid #faf3df;border-radius:50%;box-shadow:0 1px 3px #0005}
  .mobile-door.available .mini-knob{background:radial-gradient(circle at 32% 26%,#c1ffb6,#26ae48 55%,#135d29)}
  .mobile-door.locked .mini-knob{background:radial-gradient(circle at 32% 26%,#ffd1ca,#df4040 55%,#822227)}
  .mobile-door:focus-visible{outline:4px solid #ffd56c;outline-offset:0}
  .legend{gap:14px;padding:3px 5px 2px;font-size:12px}
  .note{padding:2px 7px 5px;font-size:11px;line-height:1.25}
  .modal{padding:16px;max-height:calc(100dvh - 18px)}
  .modal h2{font-size:25px;margin-bottom:8px}
  .question-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:6px}
  .question{min-width:0;font-size:18px}
  .help-toggle{font-size:13px;padding:8px}
  .toast{top:clamp(95px,20dvh,185px);bottom:auto}
}
@media (max-width:800px) and (orientation:portrait) and (max-height:630px){
  .mobile-banner{flex-basis:48px}
  .mobile-grid{gap:3px;padding:4px 8px}
  .mobile-door{border-width:1.5px}
  header p,.note{display:none}
  .legend{font-size:11px;padding:2px}
}

/* V8: Greek blue-and-white tile doors, with Greek-key borders and olive branches. */
@media (max-width:800px) and (orientation:portrait) {
 .mobile-door, .mobile-door.available, .mobile-door.locked {
   border:0; border-radius:11px; isolation:isolate;
   color:#10477d; background:linear-gradient(145deg,#fffef9,#f7f1e5);
   box-shadow:0 3px 8px #0f397331, 0 1px 0 #ffffff inset;
   padding:1px 5px 11px;

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyvlhKupwsChKfQHa7rH90J_0G2lbyUkShBeV3S28kdET6e-san9XytrRpSLsRo_iGf/exec';

const WORKER_URL = 'https://greek-advent-bridge.petromelody86.workers.dev/';
const YEAR = 2026;

const SAMPLES = {

const COLUMN_X=[327,492,657,823,988,1153];
const ROW_Y=[305,466,622,777];

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function unlockedDays(){
 if(IS_DEMO)return 3;
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const get=t=>Number(parts.find(p=>p.type===t).value);
 const y=get('year'),m=get('month'),d=get('day');
 if(y<YEAR || (y===YEAR && m<12))return 0;
 if(y>YEAR)return 24;
 return Math.min(24,d);
}
const available=unlockedDays();
if(IS_DEMO)note.textContent='🎁 Δοκιμή: οι τρεις πρώτες ημέρες είναι διαθέσιμες.';
else if(available===0)note.textContent='🎄 Τα παραθυράκια θα αρχίσουν να ανοίγουν την 1η Δεκεμβρίου.';

 const i=day-1,col=i%6,row=Math.floor(i/6),canOpen=day<=available;

}

// Google Content Service supports JSONP (public responses: task for unlocked days, or a receipt boolean).
// This avoids the Apps Script cross-origin CORS limitation without exposing answer text in query strings.
function jsonp(params,timeout=19000){
 return new Promise((resolve,reject)=>{
  const callback='advent_cb_'+Math.random().toString(36).slice(2)+Date.now();
  const script=document.createElement('script');let finished=false;
  let timer;
  function done(error,result){if(finished)return;finished=true;clearTimeout(timer);script.remove();delete window[callback];error?reject(error):resolve(result);}
  window[callback]=data=>done(null,data);
  const url=new URL(APPS_SCRIPT_URL);
  Object.entries({...params,callback,_:Date.now()}).forEach(([k,v])=>url.searchParams.set(k,String(v)));
  script.src=url.toString();script.async=true;
  script.onerror=()=>done(new Error('network error'));
  timer=setTimeout(()=>done(new Error('timeout')),timeout);
  document.head.append(script);
 });
}

// A Cloudflare Worker elkülöníti a látogatók Google-fiókját az Apps Scripttől.
async function apiGet(params,timeout=19000){
 if(!HAS_WORKER)return jsonp(params,timeout);
 const url=new URL(WORKER_URL);
 Object.entries(params).forEach(([key,val])=>url.searchParams.set(key,String(val)));
 const abort=new AbortController();
 const timer=setTimeout(()=>abort.abort(),timeout);
 try{
  const r=await fetch(url.toString(),{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',signal:abort.signal});
  if(!r.ok)throw new Error('API GET HTTP '+r.status);
  return await r.json();
 }finally{clearTimeout(timer);}
}

async function loadTask(day){
 if(!HAS_BACKEND && !HAS_WORKER){
  if(IS_DEMO && SAMPLES[day])return {ok:true,demo:true,task:SAMPLES[day],offline:true};
  return {ok:false,error:'NOT_CONFIGURED'};
 }
 return apiGet({action:'task',day,demo:IS_DEMO?'1':'0'});
}

async function openDay(day){

 previousFocus=document.activeElement;
 titleEl.textContent=`${day} Δεκεμβρίου`;
 taskEl.replaceChildren(el('p','question','⏳ Φόρτωση της άσκησης…'));
 overlay.hidden=false;
 document.getElementById('close').focus();
 let result;
 try{result=await loadTask(day);}catch(_){result={ok:false,error:'NETWORK'};}
 if(loadId!==currentLoad || overlay.hidden)return;
 taskEl.replaceChildren();
 if(!result || !result.ok){
  const err=result?.error;
  const msg=err==='LOCKED'?'Αυτό το παραθυράκι δεν έχει ανοίξει ακόμα.':
    err==='NO_TASK'?'Η άσκηση δεν έχει προστεθεί ακόμα.':
    err==='NOT_CONFIGURED'?'Η σύνδεση με τις ασκήσεις δεν έχει ρυθμιστεί ακόμα.':
    'Δεν ήταν δυνατή η φόρτωση. Δοκίμασε ξανά αργότερα.';
  taskEl.append(el('p','question',msg));return;
 }
 const task=result.task;
 taskEl.append(el('div','task-title',task.title));
 const questionRow=el('div','question-row');
 const question=el('p','question',task.question);
 questionRow.append(question);
 if(task.help){
  const helpBtn=el('button','help-toggle','💡 Βοήθεια');helpBtn.type='button';helpBtn.setAttribute('aria-expanded','false');
  questionRow.append(helpBtn);
  taskEl.append(questionRow);
  const helpText=el('div','help-text',task.help);helpText.id='help-translation';helpText.lang='de';helpText.hidden=true;
  helpBtn.setAttribute('aria-controls',helpText.id);
  helpBtn.addEventListener('click',()=>{helpText.hidden=!helpText.hidden;helpBtn.setAttribute('aria-expanded',String(!helpText.hidden));helpBtn.textContent=helpText.hidden?'💡 Βοήθεια':'✕ Απόκρυψη βοήθειας';});
  taskEl.append(helpText);
 } else taskEl.append(questionRow);
 if(task.image){
  let safe;
  try{safe=new URL(task.image,location.href);if(!/^https?:$/.test(safe.protocol))safe=null;}catch(_){safe=null;}
  if(safe){const pic=el('img','task-image');pic.src=safe.href;pic.alt='Εικόνα της ημέρας';pic.loading='lazy';pic.onerror=()=>pic.remove();taskEl.append(pic);}
 }
 const form=el('form');
 const nameLabel=el('label',null,'Το όνομά σου');
 const name=el('input');name.required=true;name.autocomplete='name';name.maxLength=80;name.id='participant-name';nameLabel.htmlFor=name.id;
 try{name.value=localStorage.getItem('greek-advent-name')||'';}catch(_){/* storage is optional */}
 const ansLabel=el('label',null,'Η απάντησή σου');
 const ans=el('textarea');ans.required=true;ans.maxLength=4000;ans.id='participant-answer';ansLabel.htmlFor=ans.id;
 const actions=el('div','actions');const send=el('button','action primary','Αποστολή');send.type='submit';actions.append(send);
 const status=el('p','status',result.offline?'Δοκιμή εκτός σύνδεσης: η απάντηση δεν φτάνει στον διοργανωτή.':
  result.demo?'Δοκιμή: η απάντηση θα σημειωθεί ως «TESZT» στο φύλλο.':'Η απάντησή σου θα αποσταλεί στον διοργανωτή.');
 status.setAttribute('aria-live','polite');
 form.append(nameLabel,name,ansLabel,ans,actions,status);
 let inProgress=false;let receipt=null;
 form.addEventListener('submit',async e=>{
  e.preventDefault();if(inProgress||!form.reportValidity())return;
  const person=name.value.trim(),answer=ans.value.trim();
  if(!person||!answer){status.textContent='Συμπλήρωσε το όνομα και την απάντησή σου.';return;}
  inProgress=true;send.disabled=true;send.textContent='Αποστολή…';status.textContent='⏳ Αποστολή και επιβεβαίωση…';
  try{
   if(result.offline){
    try{
     const previous=JSON.parse(localStorage.getItem('greek-advent-local-demo')||'[]');
     previous.push({day,name:person,answer,date:new Date().toISOString()});
     localStorage.setItem('greek-advent-local-demo',JSON.stringify(previous));
    }catch(_){/* demonstration without persistence */}
    closeDialog();showToast('✓ Η δοκιμαστική απάντηση καταχωρίστηκε μόνο σε αυτή τη συσκευή.');return;
   }
   if(!receipt)receipt=createReceipt();
   const payload={action:'submit',day,name:person,answer,receipt,demo:IS_DEMO};
   const success=await submitWithVerification(payload);
   if(!success)throw new Error('not confirmed');
   try{localStorage.setItem('greek-advent-name',person);}catch(_){/* ignore */}
   closeDialog();showToast('✓ Η απάντησή σου καταχωρίστηκε επιτυχώς!');
  }catch(_){status.textContent='⚠️ Δεν επιβεβαιώθηκε η αποστολή. Έλεγξε τη σύνδεση και δοκίμασε ξανά.';}
  finally{inProgress=false;send.disabled=false;send.textContent='Αποστολή';}
 });
 taskEl.append(form);name.focus();
}

function createReceipt(){
 if(globalThis.crypto?.randomUUID)return crypto.randomUUID().replaceAll('-','');
 if(globalThis.crypto?.getRandomValues){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');}
 return (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).padEnd(24,'0');
}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function receiptSaved(receipt){
 try{const response=await apiGet({action:'receipt',receipt},13000);return !!(response?.ok&&response.saved);}catch(_){return false;}
}
async function pollReceipt(receipt){
 for(const pause of [900,1600,2500,3500,4500]){
  await sleep(pause);
  if(await receiptSaved(receipt))return true;
 }
 return false;
}
async function submitWithVerification(payload){
  // A Worker JSON választ ad, így valódi visszaigazolást kapunk CORS-probléma nélkül.
  if(HAS_WORKER){
   const abort=new AbortController();
   const timer=setTimeout(()=>abort.abort(),26000);
   try{
    const response=await fetch(WORKER_URL,{method:'POST',mode:'cors',credentials:'omit',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify(payload),signal:abort.signal});
    if(response.ok){const result=await response.json();if(result?.ok&&result.saved)return true;}
   }catch(_){/* A kérés akár meg is érkezhetett: ellenőrizzük az azonosítót. */}
   finally{clearTimeout(timer);}
   return await pollReceipt(payload.receipt);
  }
  // Régi JSONP-útvonal: megtartva helyi teszteléshez és visszaálláshoz.
 // no-cors POST can have an opaque HTTP response; NEVER treat that as proof of success.
 try{
  await fetch(APPS_SCRIPT_URL,{
   method:'POST',mode:'no-cors',redirect:'follow',
   headers:{'Content-Type':'text/plain;charset=utf-8'},
   body:JSON.stringify(payload)
  });
 }catch(_){
  // Some mobile browsers/preview environments disallow a cross-origin fetch.
  sendHiddenForm(payload);
 }
 if(await pollReceipt(payload.receipt))return true;
 // Retry as a native form submission. The backend de-duplicates by receipt.
 sendHiddenForm(payload);
 return await pollReceipt(payload.receipt);
}
function sendHiddenForm(payload){
 const iframe=document.createElement('iframe');
 iframe.name='advent_hidden_'+Math.random().toString(36).slice(2);
 iframe.title='Αποστολή';iframe.hidden=true;
 const form=document.createElement('form');form.action=APPS_SCRIPT_URL;form.method='POST';form.target=iframe.name;
 const field=document.createElement('input');field.type='hidden';field.name='payload';field.value=JSON.stringify(payload);
 form.append(field);document.body.append(iframe,form);form.submit();
 setTimeout(()=>{iframe.remove();form.remove();},45000);
}
function closeDialog(){currentLoad++;overlay.hidden=true;if(previousFocus?.focus)previousFocus.focus();}
function showToast(msg){toast.textContent=msg;toast.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{toast.hidden=true;},7000);}
document.getElementById('close').addEventListener('click',closeDialog);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeDialog();});

</script>
